apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rishop
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: rishop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: rishop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      terminationGracePeriodSeconds: 15
      minReadySeconds: 4
      imagePullSecrets:
        - name: ghcr-registry-secret
      containers:
        - name: api-gateway
          image: ghcr.io/ribunloc/rishop-api-gateway:4847199
          ports:
            - name: http
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: rishop-backend-config
            - secretRef:
                name: rishop-backend-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
