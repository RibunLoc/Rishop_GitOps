apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: rishop
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: rishop
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090