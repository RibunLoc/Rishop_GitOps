apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: rishop
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: rishop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: rishop
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: 
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - thanhloc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      terminationGracePeriodSeconds: 15
      imagePullSecrets:
        - name: ghcr-registry-secret
      containers:
        - name: order-service
          image: ghcr.io/ribunloc/rishop-order-service:3beb398
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rishop-backend-config
            - secretRef:
                name: rishop-backend-secret
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: HTTP_PORT
              value: "8080"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: rishop-backend-config
                  key: ORDER_POSTGRES_DB
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: rishop-backend-config
                  key: ORDER_REDIS_DB
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
