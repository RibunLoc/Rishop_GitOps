apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rishop
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: rishop
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: grpc
      protocol: TCP
      port: 50052
      targetPort: 50052
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081