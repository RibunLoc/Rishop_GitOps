apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: rishop
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: rishop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: rishop
    spec:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: role
      #             operator: In
      #             values:
      #               - web-worker 
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      terminationGracePeriodSeconds: 15
      imagePullSecrets:
        - name: ghcr-registry-secret
      containers:
        - name: product-service
          image: ghcr.io/ribunloc/rishop-product-service:4847199
          ports:
            - name: grpc
              containerPort: 50053
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: rishop-backend-config
            - secretRef:
                name: rishop-backend-secret
          env:
            - name: GRPC_PORT
              value: "50053"
            - name: HTTP_PORT
              value: "8082"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: rishop-backend-config
                  key: PRODUCT_POSTGRES_DB
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: rishop-backend-config
                  key: PRODUCT_REDIS_DB
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
