apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rishop-backend-secret
  namespace: rishop
  annotations:
    # Chạy trước các workload để Secret sẵn sàng khi pod khởi động
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: rishop-backend-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/rishop/backend